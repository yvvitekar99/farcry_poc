; Per-device quality tiers. Android picks a profile automatically from the GPU name
; (matching rules live in Engine/Config/BaseDeviceProfiles.ini).
;   Galaxy S22 (Snapdragon 8 Gen 1, Adreno 730)  -> Android_Adreno7xx_Vulkan  = baseline tier
;   Galaxy S22 (Exynos 2200, Xclipse 920)        -> Android_Xclipse_9xx_Vulkan = baseline tier
;   Galaxy S25 Ultra (Snapdragon 8 Elite, Adreno 830) -> Android_Adreno8xx_Vulkan = high tier
; Everything else keeps the engine defaults.
; fc.FramePace is the real frame cap on Android (applied by UFramePaceSubsystem); t.MaxFPS alone is ignored there.

; ---- Baseline tier: 30 FPS locked, must hold for 15+ minutes without throttling ----
[Android_Adreno7xx_Vulkan DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Adreno7xx
+CVars=t.MaxFPS=30
+CVars=fc.FramePace=30
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.8
+CVars=r.ViewDistanceScale=0.8
+CVars=foliage.DensityScale=0.7
+CVars=grass.DensityScale=0.7
+CVars=r.MaxAnisotropy=4

[Android_Xclipse_9xx_Vulkan DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Xclipse_9xx
+CVars=t.MaxFPS=30
+CVars=fc.FramePace=30
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.8
+CVars=r.ViewDistanceScale=0.8
+CVars=foliage.DensityScale=0.7
+CVars=grass.DensityScale=0.7
+CVars=r.MaxAnisotropy=4

; ---- High tier: 30 FPS at higher quality (try fc.FramePace=60 once the game is profiled) ----
[Android_Adreno8xx_Vulkan DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Adreno8xx
+CVars=t.MaxFPS=30
+CVars=fc.FramePace=30
+CVars=r.MobileContentScaleFactor=1.5
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=r.Shadow.MaxCSMResolution=2048
+CVars=r.Shadow.DistanceScale=1.0
+CVars=r.ViewDistanceScale=1.0
+CVars=foliage.DensityScale=1.0
+CVars=grass.DensityScale=1.0
+CVars=r.MaxAnisotropy=8
